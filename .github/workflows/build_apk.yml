name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Ensure Android Platform Exists & Patch SDK
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name xray_ultra .
          fi
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/compileSdk .*/compileSdk 35/g' $BUILD_GRADLE
            sed -i 's/targetSdk .*/targetSdk 35/g' $BUILD_GRADLE
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' $BUILD_GRADLE
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' $BUILD_GRADLE
            
            # افزودن صریح نسخه ابزار ساخت برای رفع خطای aapt2
            sed -i '/defaultConfig {/a \    buildToolsVersion "35.0.0"' $BUILD_GRADLE
          fi

      - name: Install Android SDK Build-Tools 35
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;35.0.0" || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-ultra-release
          path: build/app/outputs/flutter-apk/app-release.apk
