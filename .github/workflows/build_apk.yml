```yaml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Android Platform
        run: flutter create --platforms=android --project-name husky_vpn .

      - name: Patch Android Build.gradle (Clean Minify & Fix SDK)
        run: |
          python3 -c '
          import re
          p = "android/app/build.gradle"
          c = open(p).read()

          c = re.sub(r"compileSdk\s+.*", "compileSdk 35", c)
          c = re.sub(r"targetSdk\s+.*", "targetSdk 35", c)
          c = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 35", c)
          c = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 35", c)

          if "namespace" not in c:
              c = c.replace(
                  "android {",
                  "android {\n    namespace \"com.example.husky_vpn\""
              )

          if "buildToolsVersion" in c:
              c = re.sub(
                  r"buildToolsVersion\s+\"[^\"]+\"",
                  "buildToolsVersion \"35.0.0\"",
                  c
              )
          else:
              c = c.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        buildToolsVersion \"35.0.0\""
              )

          c = re.sub(r".*minifyEnabled.*\n?", "", c)
          c = re.sub(r".*isMinifyEnabled.*\n?", "", c)
          c = re.sub(r".*shrinkResources.*\n?", "", c)
          c = re.sub(r".*isShrinkResources.*\n?", "", c)

          open(p, "w").write(c)
          '

      - name: Install Android SDK Platform and Build-Tools 35
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # Decode the persistent release keystore from GitHub Secrets.
      - name: Setup Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          test -n "$SIGNING_KEY_BASE64" || {
            echo "ERROR: SIGNING_KEY_BASE64 secret is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret is missing"
            exit 1
          }

          mkdir -p android/app

          printf '%s' "$SIGNING_KEY_BASE64" \
            | base64 --decode > android/app/my-release-key.jks

          test -s android/app/my-release-key.jks

          {
            echo "storeFile=my-release-key.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > android/key.properties

      - name: Configure Release Signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          c = p.read_text()

          if "keystoreProperties" not in c:
              signing_properties = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
              c = signing_properties + c

          if "signingConfigs {" not in c:
              signing_config = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """
              c = c.replace("    buildTypes {", signing_config + "    buildTypes {", 1)

          # Ensure release uses the configured release key.
          if "signingConfig signingConfigs.release" not in c:
              marker = "release {"
              pos = c.find(marker, c.find("buildTypes {"))
              if pos == -1:
                  raise SystemExit("Could not find release buildType in build.gradle")

              insert_at = pos + len(marker)
              c = c[:insert_at] + "\n            signingConfig signingConfigs.release" + c[insert_at:]

          p.write_text(c)
          PY

      - name: Build Release APK (Split per ABI)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: husky-vpn-release-apks
          path: build/app/outputs/flutter-apk/
```
