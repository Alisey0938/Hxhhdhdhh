name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Install Android SDK 35 and Build-Tools
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ensure Android Platform Exists & Patch build.gradle
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name xray_ultra .
          fi
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          
          import re
          content = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 35", content)
          content = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 35", content)
          content = re.sub(r"compileSdk\s+.*", "compileSdk 35", content)
          content = re.sub(r"targetSdk\s+.*", "targetSdk 35", content)

          if "buildToolsVersion" in content:
              content = re.sub(r"buildToolsVersion\s+\"[^\"]+\"", "buildToolsVersion \"35.0.0\"", content)
          else:
              content = content.replace("defaultConfig {", "defaultConfig {\n        buildToolsVersion \"35.0.0\"")

          with open(path, "w") as f:
              f.write(content)
          print("Successfully patched build.gradle to SDK 35")
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-ultra-release
          path: build/app/outputs/flutter-apk/app-release.apk
