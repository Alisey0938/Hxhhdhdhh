name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Create Android Platform
        run: |
          if [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android \
              --project-name husky_vpn .
          fi

      - name: Configure Android Signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          test -n "$SIGNING_KEY_BASE64" || {
            echo "Missing SIGNING_KEY_BASE64 secret"
            exit 1
          }

          mkdir -p android/app

          printf '%s' "$SIGNING_KEY_BASE64" \
            | base64 --decode > android/app/my-release-key.jks

          test -s android/app/my-release-key.jks

          {
            echo "storeFile=my-release-key.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > android/app/key.properties

      - name: Configure Gradle Release Signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("android/app/build.gradle not found")

          c = p.read_text()

          if "keystorePropertiesFile" not in c:
              config = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("app/key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
              c = config + c

          if "signingConfigs {" not in c:
              signing = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """
              c = c.replace("    buildTypes {", signing + "    buildTypes {", 1)

          # Ensure the release build uses the persistent release key.
          if re.search(r"signingConfig\s+signingConfigs\.debug", c):
              c = re.sub(
                  r"signingConfig\s+signingConfigs\.debug",
                  "signingConfig signingConfigs.release",
                  c
              )
          elif re.search(r"release\s*\{", c):
              c = re.sub(
                  r"(release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  c,
                  count=1
              )

          p.write_text(c)
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build Release APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: husky-vpn-release-apks
          path: build/app/outputs/flutter-apk/*.apk
