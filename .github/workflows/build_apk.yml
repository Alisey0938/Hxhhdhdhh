name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Android Platform & Patch SDK & Namespace
        run: |
          flutter create --platforms=android --project-name xray_ultra .
          python3 -c '
          import re
          p = "android/app/build.gradle"
          c = open(p).read()
          c = re.sub(r"compileSdk\s+.*", "compileSdk 35", c)
          c = re.sub(r"targetSdk\s+.*", "targetSdk 35", c)
          c = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 35", c)
          c = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 35", c)
          c = c.replace("isMinifyEnabled", "minifyEnabled")
          c = c.replace("isShrinkResources", "shrinkResources")
          if "namespace" not in c:
              c = c.replace("android {", "android {\n    namespace \"com.example.xray_ultra\"")
          if "buildToolsVersion" in c:
              c = re.sub(r"buildToolsVersion\s+\"[^\"]+\"", "buildToolsVersion \"35.0.0\"", c)
          else:
              c = c.replace("defaultConfig {", "defaultConfig {\n        buildToolsVersion \"35.0.0\"")
          open(p, "w").write(c)
          '

      - name: Install Android SDK Platform and Build-Tools 35
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-ultra-release
          path: build/app/outputs/flutter-apk/app-release.apk
