name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Android Platform
        run: flutter create --platforms=android --project-name husky_vpn .

      - name: Patch Android Build.gradle
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          c = p.read_text()

          c = re.sub(r"compileSdk\s+.*", "compileSdk 35", c)
          c = re.sub(r"targetSdk\s+.*", "targetSdk 35", c)
          c = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 35", c)
          c = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 35", c)

          if "namespace" not in c:
              c = c.replace(
                  "android {",
                  'android {\n    namespace "com.example.husky_vpn"',
                  1
              )

          c = re.sub(r".*minifyEnabled.*\n?", "", c)
          c = re.sub(r".*isMinifyEnabled.*\n?", "", c)
          c = re.sub(r".*shrinkResources.*\n?", "", c)
          c = re.sub(r".*isShrinkResources.*\n?", "", c)

          # Keep the plugins block first; add signing configuration after it.
          if "keystorePropertiesFile" not in c:
              match = re.search(r"(?m)^plugins\s*\{.*?^\}", c, re.S)
              if not match:
                  raise SystemExit("Could not find plugins {} block")

              signing_properties = '''
          
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              c = c[:match.end()] + signing_properties + c[match.end():]

          if "signingConfigs {" not in c:
              release_signing = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          '''
              if "    buildTypes {" not in c:
                  raise SystemExit("Could not find buildTypes {} block")
              c = c.replace("    buildTypes {", release_signing + "    buildTypes {", 1)

          # Set release signing only inside the release build type.
          build_types_pos = c.find("buildTypes {")
          release_pos = c.find("release {", build_types_pos)
          if release_pos == -1:
              raise SystemExit("Could not find release build type")

          brace_pos = c.find("{", release_pos)
          next_brace = c.find("}", brace_pos)
          release_block = c[brace_pos + 1:next_brace]

          if "signingConfig" not in release_block:
              c = c[:brace_pos + 1] + '''
                      signingConfig signingConfigs.release
          ''' + c[brace_pos + 1:]

          p.write_text(c)
          PY

      - name: Install Android SDK Platform and Build-Tools 35
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Setup Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          test -n "$SIGNING_KEY_BASE64" || {
            echo "Missing SIGNING_KEY_BASE64 secret"
            exit 1
          }

          mkdir -p android/app

          printf '%s' "$SIGNING_KEY_BASE64" \
            | base64 --decode > android/app/my-release-key.jks

          test -s android/app/my-release-key.jks

          {
            echo "storeFile=my-release-key.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > android/key.properties

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: husky-vpn-release-apks
          path: build/app/outputs/flutter-apk/*.apk
