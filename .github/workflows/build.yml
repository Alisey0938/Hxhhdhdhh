name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # ایجاد خودکار ساختار اندروید نسخه جدید (v2 Embedding)
    - name: Generate Fresh Android Structure
      run: |
        rm -rf android
        flutter create . --platforms=android --org=com.v2ray.app -i swift -a kotlin

    # تنظیم حداقل نسخه SDK مورد نیاز برای v2ray
    - name: Fix Min SDK and Properties
      run: |
        sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
