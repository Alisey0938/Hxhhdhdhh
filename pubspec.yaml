name: v2ray_app
description: "A Flutter V2Ray / Xray VPN Client Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # پکیج اصلی V2Ray/Xray با پشتیبانی کامل از VLESS, Reality, gRPC
  flutter_v2ray: ^1.0.10

  # دریافت سرورها از فایربیس
  http: ^1.2.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
