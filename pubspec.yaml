name: xray_ultra
description: "A Flutter V2Ray VPN client application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_v2ray: ^1.0.10
  url_launcher: ^6.2.5
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#FFFFFF" # پس‌زمینه سفید برای آیکون تطبیقی
  adaptive_icon_foreground: "assets/icon/icon.png"
