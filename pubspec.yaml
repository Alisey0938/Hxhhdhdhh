### ۲. کد کامل فایل `build_apk.yml`
وارد پوشه `.github/workflows/` شوید و فایل `build_apk.yml` را باز کنید. کل محتوای قبلی را پاک کرده و این کد کامل را جایگزین آن کنید و ذخیره نمایید[cite: 10, 15]:

```yaml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Ensure Android Platform Exists
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name xray_ultra .
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: flutter pub run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-ultra-release
          path: build/app/outputs/flutter-apk/app-release.apk
```[cite: 15]

---

### نتیجه:
با انجام این کار، تمام قابلیت‌های قبلی اپلیکیشن (مانند مدیریت کانفیگ‌ها، پینگ‌‌گیری، سیستم لایسنس، کنترل دستگاه‌ها و بنر اطلاعیه) کاملاً حفظ خواهند شد و گیت‌هاب به طور خودکار ابتدا آیکون جدید را روی برنامه اعمال کرده و سپس فایل APK نهایی را با لوگوی جدید تحویل شما می‌دهد[cite: 6, 7, 8, 14, 15].
